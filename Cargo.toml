[package]
name = "local-runner"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.35", features = ["derive"] }
ctrlc = "3.4.6"
duct = "0.13.7"
colored = "3"
log = { version = "0.4", features = ["std"] }
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
shlex = "1.3.0"
thiserror = "2.0.12"
toml = "0.8.20"
indexmap = "2.14.0"
ratatui = "0.30.2"
crossterm = "0.29.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29.0", features = ["process"] }
